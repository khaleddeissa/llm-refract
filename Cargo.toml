[workspace]
members = ["crates/*"]
resolver = "3"
[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
zip = { version = "8", default-features = false }
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "tls-rustls", "migrate", "macros"] }
clap = { version = "4", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
aes-gcm = "0.11"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
opentelemetry-proto = { version = "0.33", features = ["gen-tonic", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14"
tonic = "0.14"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = "1"
aws-types = "1"
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "warn"
