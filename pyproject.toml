[project]
name = "refract-workspace"
version = "0.1.4"
description = "Development workspace for the Refract execution engine and interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "llm-refract[mcp]",
]

[project.urls]
Repository = "https://github.com/khaleddeissa/llm-refract"
Documentation = "https://github.com/khaleddeissa/llm-refract/tree/main/docs"
Issues = "https://github.com/khaleddeissa/llm-refract/issues"

[dependency-groups]
dev = [
    "jsonschema>=4.0",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python"]

[tool.uv.sources]
llm-refract = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/python/tests",
    "packages/github-action/tests",
    "tests/contract",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["refract", "refract_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["packages/python/src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Existing decorator APIs use gradual typing; new typed modules can enable strict mode.
