[project]
name = "refract-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["refract", "refract-mcp"]
[tool.uv.workspace]
members = ["packages/python", "mcp/server"]
[tool.uv.sources]
refract = { workspace = true }
refract-mcp = { workspace = true }
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "jsonschema>=4", "pre-commit>=4"]
[tool.pytest.ini_options]
testpaths = ["packages/python/tests", "tests/contract", "mcp/server/tests", "action/tests"]
[tool.ruff]
line-length = 100
