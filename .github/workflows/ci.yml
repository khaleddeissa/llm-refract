name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make setup ci test-contract
      - run: cargo run -p refract-artifact --example inspect
      - run: uv run python examples/python/basic/record.py
      - run: node examples/typescript/basic/record.mjs
      - run: cargo run -p refract-cli -- validate .examples/example.rfr
      - run: cargo run -p refract-cli -- validate .examples/typescript-example.rfr
      - run: cargo run -p refract-cli -- pack tests/fixtures/simple-run/execution.json -o /tmp/rust-example.rfr
      - run: node tests/contract/artifact.mjs /tmp/rust-example.rfr
