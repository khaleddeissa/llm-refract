name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make setup ci
      - run: uv run python examples/python/basic/record.py
      - run: node examples/typescript/basic/record.mjs
      - run: cargo run -p refract-cli -- validate example.rfr
      - run: cargo run -p refract-cli -- validate typescript-example.rfr
      - run: cargo run -p refract-cli -- pack tests/fixtures/simple-run/execution.json -o /tmp/rust-example.rfr
      - run: node scripts/cross-language.mjs /tmp/rust-example.rfr
