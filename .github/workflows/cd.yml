name: Container candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: python3 scripts/smoke-test.py
      - if: always()
        run: docker compose down
