name: Docker and browser tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Check for relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "apps/**"
              - "crates/**"
              - "packages/**"
              - "tests/**"
              - "examples/**"
              - "Dockerfile"
              - "docker-compose.yml"
              - "deploy/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "package.json"
              - "package-lock.json"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/test.yml"

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: uv sync --locked --all-packages --all-extras

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build -w @llm-refract/sdk

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: docker compose up --build -d --wait

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: make test-integration test-interfaces test-e2e

      - if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        name: Integrated model, identity, telemetry and delivery smoke
        run: |
          docker image tag "$(docker compose images -q refract)" llm-refract:ci
          export REFRACT_TEST_IMAGE=llm-refract:ci
          docker compose -p refract-smoke -f tests/integration/compose.yml up -d --wait
          uv run --locked --all-packages --all-extras python tests/integration/full_stack.py
          docker compose -p refract-smoke -f tests/integration/compose.yml exec -T provider node -e 'fetch("http://localhost:8080/counts").then(r=>r.json()).then(c=>{console.log(c);if(!c.webhooks || !c.objects) process.exit(1)}).catch(()=>process.exit(1))'
          docker compose -p refract-smoke -f tests/integration/compose.yml restart server
          docker compose -p refract-smoke -f tests/integration/compose.yml up -d --wait
          uv run --locked --all-packages --all-extras python tests/integration/full_stack.py --verify-restart

      - if: always() && (steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        name: Clean up the disposable integrated stack
        run: docker compose -p refract-smoke -f tests/integration/compose.yml down -v

      - if: always() && (steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        run: docker compose logs && docker compose down

      - if: steps.changes.outputs.relevant != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No relevant files changed — skipping integration tests."

  postgres:
    name: PostgreSQL storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: refract
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: refract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refract -d refract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      REFRACT_TEST_POSTGRES_URL: postgres://refract:integration-only-password@localhost:5432/refract_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p refract-storage postgres_ -- --ignored --nocapture
