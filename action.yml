name: Refract execution regression
description: Compare a freshly recorded execution against a checked-in baseline
inputs:
  baseline:
    description: Baseline .rfr or canonical JSON path
    required: true
  actual:
    description: Newly recorded .rfr or canonical JSON path
    required: true
  comparison-options:
    description: Optional JSON file with semantic similarity and cost/latency/token budget thresholds
    required: false
branding:
  icon: activity
  color: purple
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.94.0
    - shell: bash
      env:
        REFRACT_SOURCE: ${{ github.action_path }}
      run: cargo build --locked --release --manifest-path "$REFRACT_SOURCE/Cargo.toml" -p refract-cli
    - shell: bash
      env:
        REFRACT_SOURCE: ${{ github.action_path }}
        REFRACT_BASELINE: ${{ inputs.baseline }}
        REFRACT_ACTUAL: ${{ inputs.actual }}
        REFRACT_COMPARE_OPTIONS: ${{ inputs.comparison-options }}
      run: python3 "$REFRACT_SOURCE/packages/github-action/compare.py" "$REFRACT_BASELINE" "$REFRACT_ACTUAL" --cli "$REFRACT_SOURCE/target/release/refract"
