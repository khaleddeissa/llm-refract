[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "refract"
version = "0.1.0"
description = "Provider-neutral Python instrumentation and portable execution artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "execution", "replay", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/khaleddeissa/llm-refract"
Documentation = "https://github.com/khaleddeissa/llm-refract/tree/main/docs"
Issues = "https://github.com/khaleddeissa/llm-refract/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/refract"]
